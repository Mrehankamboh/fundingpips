<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Support Tickets | FundingPips Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/portal.css?v=41" />
  <style>
    .desk { display: grid; grid-template-columns: 320px 1fr; gap: 16px; max-width: 1100px; margin: 24px auto; padding: 0 16px; min-height: 70vh; }
    .desk-list, .desk-thread { background: #fff; border: 1px solid #e6e8ee; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .desk-list h2, .desk-thread h2 { margin: 0; padding: 14px 16px; font-size: 16px; border-bottom: 1px solid #eef0f4; }
    .ticket-item { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #f0f2f5; background: #fff; padding: 12px 14px; cursor: pointer; }
    .ticket-item.on { background: #eef3fb; }
    .ticket-item strong { display: block; font-size: 14px; }
    .ticket-item span { display: block; font-size: 12px; color: #626773; margin-top: 4px; }
    .msgs { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #f6f7f9; min-height: 320px; }
    .bubble { max-width: 80%; padding: 10px 12px; border-radius: 12px; background: #fff; border: 1px solid #e6e8ee; font-size: 14px; }
    .bubble.admin { align-self: flex-end; background: #00225a; color: #fff; border-color: #00225a; }
    .bubble.user { align-self: flex-start; }
    .reply { display: grid; gap: 8px; padding: 12px; border-top: 1px solid #eef0f4; }
    .reply textarea, .reply select { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #d7dbe3; font: inherit; }
    .reply button { height: 40px; border: 0; border-radius: 8px; background: #00225a; color: #fff; font-weight: 600; cursor: pointer; }
    .desk-meta { padding: 0 16px 8px; font-size: 13px; color: #626773; }
    .admin-err { color: #b42318; padding: 16px; }
    @media (max-width: 860px) { .desk { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="app-banner" role="banner">Admin · Support</div>
    <div class="app-body">
      <aside class="app-rail" id="app-rail"></aside>
      <div class="app-main">
        <header class="app-topbar" id="app-topbar"></header>
        <div class="app-content">
          <p id="desk-status" style="max-width:1100px;margin:16px auto 0;padding:0 16px">Loading…</p>
          <div class="desk" id="desk" hidden>
            <section class="desk-list">
              <h2>Tickets</h2>
              <div id="ticket-list"></div>
            </section>
            <section class="desk-thread">
              <h2 id="thread-title">Select a ticket</h2>
              <div class="desk-meta" id="thread-meta"></div>
              <div class="msgs" id="msgs"></div>
              <form class="reply" id="reply-form">
                <textarea id="reply-body" rows="3" placeholder="Write an admin reply…" required></textarea>
                <select id="reply-status">
                  <option value="open">Open</option>
                  <option value="in_progress">In progress</option>
                  <option value="resolved">Resolved</option>
                  <option value="closed">Closed</option>
                </select>
                <button type="submit">Send reply</button>
              </form>
            </section>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/shell.js?v=7"></script>
  <script src="js/portal.js?v=14"></script>
  <script>
    (function () {
      const statusEl = document.getElementById("desk-status");
      const desk = document.getElementById("desk");
      const listEl = document.getElementById("ticket-list");
      const msgsEl = document.getElementById("msgs");
      const titleEl = document.getElementById("thread-title");
      const metaEl = document.getElementById("thread-meta");
      const form = document.getElementById("reply-form");
      const bodyEl = document.getElementById("reply-body");
      const statusSel = document.getElementById("reply-status");
      let tickets = [];
      let selected = "";

      async function loadList() {
        const res = await fetch("/api/admin/tickets", { credentials: "same-origin" });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "Failed to load tickets");
        tickets = data.tickets || [];
        statusEl.textContent = tickets.length + " tickets";
        listEl.innerHTML = tickets
          .map(
            (t) =>
              '<button type="button" class="ticket-item' +
              (t.id === selected ? " on" : "") +
              '" data-id="' +
              t.id +
              '"><strong>' +
              (t.subject || "Support") +
              " · " +
              (t.status || "open") +
              "</strong><span>" +
              (t.name || "Visitor") +
              (t.email ? " · " + t.email : "") +
              "<br>" +
              (t.lastAuthor === "admin" ? "You: " : "") +
              (t.lastMessage || "No messages") +
              "</span></button>"
          )
          .join("");
      }

      async function loadThread(id) {
        selected = id;
        const ticket = tickets.find((t) => t.id === id);
        titleEl.textContent = (ticket && ticket.subject) || "Ticket";
        metaEl.textContent = ticket
          ? (ticket.name || "Visitor") +
            (ticket.email ? " · " + ticket.email : "") +
            " · " +
            (ticket.status || "open")
          : "";
        if (ticket) statusSel.value = ticket.status || "open";
        const res = await fetch("/api/admin/tickets?id=" + encodeURIComponent(id), {
          credentials: "same-origin",
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "Failed to load messages");
        msgsEl.innerHTML = (data.messages || [])
          .map(
            (m) =>
              '<div class="bubble ' +
              (m.author === "admin" ? "admin" : "user") +
              '">' +
              (m.author === "admin" ? "Admin: " : "User: ") +
              String(m.body || "").replace(/</g, "&lt;") +
              "</div>"
          )
          .join("");
        msgsEl.scrollTop = msgsEl.scrollHeight;
        Array.from(listEl.querySelectorAll(".ticket-item")).forEach((btn) => {
          btn.classList.toggle("on", btn.dataset.id === id);
        });
      }

      document.addEventListener("fp:user", async (ev) => {
        if (ev.detail.role !== "admin") {
          statusEl.className = "admin-err";
          statusEl.textContent = "Admin only. Set ADMIN_EMAIL to your login email.";
          return;
        }
        try {
          desk.hidden = false;
          await loadList();
          if (tickets[0]) await loadThread(tickets[0].id);
        } catch (err) {
          statusEl.className = "admin-err";
          statusEl.textContent = err.message || "Failed";
        }
      });

      listEl.addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-id]");
        if (!btn) return;
        try {
          await loadThread(btn.dataset.id);
        } catch (err) {
          alert(err.message || "Failed");
        }
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!selected) return;
        const message = bodyEl.value.trim();
        if (!message) return;
        try {
          const res = await fetch("/api/admin/tickets", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              id: selected,
              message,
              status: statusSel.value,
            }),
          });
          const data = await res.json();
          if (!res.ok || data.ok === false) throw new Error(data.error || "Send failed");
          bodyEl.value = "";
          await loadList();
          await loadThread(selected);
        } catch (err) {
          alert(err.message || "Send failed");
        }
      });

      setInterval(async () => {
        if (!desk || desk.hidden) return;
        try {
          await loadList();
          if (selected) await loadThread(selected);
        } catch (_) {}
      }, 8000);
    })();
  </script>
  <script>FPShell.render("Admin");</script>
</body>
</html>
