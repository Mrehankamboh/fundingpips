<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password | FundingPips</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/portal.css?v=41" />
</head>
<body>
  <div class="forgot-page">
    <div class="forgot-card">
      <img src="https://fundingpips.com/images/labs/footer-wordmark.svg" alt="FundingPips" width="160" height="32" />
      <h1>Reset Password</h1>
      <form class="reset-form" action="/api/auth/reset" method="post">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
        <label for="password_confirmation">Confirm password</label>
        <input id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="8" required />
        <button type="submit">Save new password</button>
      </form>
      <p class="back"><a href="login.html">Back to sign in</a></p>
    </div>
  </div>
  <script src="js/portal.js?v=17"></script>
</body>
</html>
