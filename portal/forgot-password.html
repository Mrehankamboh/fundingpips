<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password | FundingPips</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/portal.css?v=40" />
</head>
<body>
  <div class="forgot-page">
    <div class="forgot-card">
      <img src="https://fundingpips.com/images/labs/footer-wordmark.svg" alt="FundingPips" width="160" height="32" />
      <h1>Forgot Password</h1>
      <form class="forgot-form" action="/api/auth/forgot" method="post">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required />
        <button type="submit">Send Reset Link</button>
      </form>
      <p class="back">Remembered your password? <a href="login.html">Sign in</a></p>
    </div>
  </div>
  <script src="js/portal.js?v=17"></script>
</body>
</html>
